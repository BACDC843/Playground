<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Renew Urban — Post Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>
  .ad-wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
  .ad-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
  .ad-h{font-family:var(--serif);font-size:20px;color:var(--dark);margin-bottom:4px}
  .ad-sub{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.5}
  .ad-row{display:flex;gap:12px;flex-wrap:wrap}
  .ad-row>*{flex:1 1 220px}
  .ad-f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .ad-f label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .ad-f input,.ad-f textarea,.ad-f select{font:inherit;font-size:14px;border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
  .ad-f textarea{min-height:120px;resize:vertical;line-height:1.45}
  .ad-f input:focus,.ad-f textarea:focus{outline:2px solid var(--gold-lt);border-color:var(--gold)}
  .ad-meter{font-size:12px;color:var(--muted);display:flex;gap:14px}
  .ad-meter .bad{color:var(--red);font-weight:700}
  .ad-btn{border:none;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans)}
  .ad-pri{background:var(--gold);color:#fff}
  .ad-sec{background:var(--stone);color:var(--dark)}
  .ad-dan{background:transparent;color:var(--red);border:1px solid var(--red)}
  .ad-btn:disabled{opacity:.5;cursor:default}
  .ad-imgs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}
  .ad-img{width:120px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--stone);font-size:11px}
  .ad-img img{width:120px;height:150px;object-fit:cover;display:block}
  .ad-img .ad-ic{display:flex;justify-content:space-between;padding:3px 4px}
  .ad-img button{border:none;background:none;cursor:pointer;font-size:14px;padding:2px 5px;color:var(--dark)}
  .ad-drop{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
  .ad-drop.over{border-color:var(--gold);background:#fffaf0}
  .ad-msg{padding:10px 12px;border-radius:8px;font-size:13px;margin:10px 0;line-height:1.45}
  .ad-err{background:#fbe9e7;color:#7a1f14;border:1px solid #f0b7ae}
  .ad-warn{background:#fff8e1;color:#5a4500;border:1px solid #f0c040}
  .ad-ok{background:#e8f3ec;color:#1f4d2e;border:1px solid #a9d1b5}
  .ad-list-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
  .ad-list-item:first-child{border-top:none}
  .ad-list-item img{width:64px;height:80px;object-fit:cover;border-radius:6px;background:var(--stone);flex-shrink:0}
  .ad-li-main{flex:1;min-width:0}
  .ad-li-t{font-weight:700;color:var(--dark);font-size:14px}
  .ad-li-s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .ad-li-a{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
  .ad-chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-right:6px}
  .c-pending{background:var(--stone);color:var(--dark)}
  .c-approved{background:#e8f3ec;color:#1f4d2e}
  .c-changes_requested{background:#fbe9e7;color:#7a1f14}
  .ad-note{background:#fff8e1;border-left:3px solid var(--gold);padding:6px 10px;margin-top:6px;font-size:12px;color:var(--ink);border-radius:4px}
  .ad-hidden{display:none}
  @media (max-width:600px){.ad-list-item{flex-wrap:wrap}.ad-li-a{width:100%}}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo">RENEW <span>URBAN</span></div>
  <a href="/?tab=approvals" style="color:#fff;font-size:12px;text-decoration:none;opacity:.8">Reviewer view →</a>
</div>
<div class="ad-wrap" id="app">
  <div class="ldg"><div class="spin"></div>Loading…</div>
</div>
<script src="admin.js"></script>
</body>
</html>
